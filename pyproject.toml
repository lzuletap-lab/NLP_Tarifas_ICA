[project]
name = "nlp-tarifas-ica"
version = "0.1.0"
description = "Extraccion de tarifas ICA desde estatutos municipales en PDF"
authors = [
    {name = "igomezg1-ux",email = "igomezg1@ucentral.edu.co"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pdfplumber (>=0.11.10,<0.12.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "numpy (>=2.5.5,<3.0.0)",
    "nltk (>=3.10.4,<4.0.0)",
    "spacy (>=3.8.18,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "gensim (>=4.4.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.4.0,<8.0.0)",
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.poetry]
packages = [{ include = "nlp_tarifas_ica", from = "src" }]